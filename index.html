<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lincoln Fischer</title>
  <meta name="description" content="Lincoln Fischer - Texas A&M Agribusiness student. LinkedIn and resume." />
  <style>
    :root {
      --maroon: #500000;
      --maroon-dark: #3b0000;
      --ink: #171717;
      --muted: #666;
      --paper: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: radial-gradient(circle at top, #ffffff 0, #fbfafa 42%, #f3eeee 100%);
    }
    .card {
      width: min(560px, 100%);
      background: var(--paper);
      border: 2px solid var(--maroon);
      border-radius: 22px;
      padding: 38px 34px 30px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(80, 0, 0, 0.12);
    }
    .logo {
      width: 126px;
      height: 126px;
      object-fit: contain;
      display: block;
      margin: 0 auto 20px;
      border-radius: 50%;
    }
    h1 {
      font-size: clamp(2.3rem, 8vw, 3.65rem);
      line-height: 1;
      margin: 0;
      letter-spacing: -0.035em;
    }
    .rule {
      width: 100%;
      height: 2px;
      background: var(--maroon);
      margin: 18px 0 20px;
    }
    .subtitle {
      margin: 0;
      font-size: 1.23rem;
      font-weight: 700;
    }
    .grad {
      margin: 7px 0 26px;
      color: var(--muted);
      font-size: 1rem;
    }
    .links {
      display: grid;
      gap: 14px;
    }
    .button {
      display: block;
      width: 100%;
      text-decoration: none;
      border-radius: 12px;
      padding: 16px 20px;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(80,0,0,.12);
    }
    .primary {
      background: var(--maroon);
      color: #fff;
      border: 2px solid var(--maroon);
    }
    .primary:hover { background: var(--maroon-dark); }
    .secondary {
      background: #fff;
      color: var(--maroon);
      border: 2px solid var(--maroon);
    }
    .note {
      margin: 22px auto 0;
      max-width: 420px;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: .82rem;
      line-height: 1.45;
    }
    .footer {
      margin-top: 28px;
      color: var(--maroon);
      text-transform: uppercase;
      letter-spacing: .23em;
      font-family: Arial, Helvetica, sans-serif;
      font-size: .72rem;
      font-weight: 700;
    }
    @media (max-width: 480px) {
      .card { padding: 30px 22px 25px; border-radius: 18px; }
      .logo { width: 108px; height: 108px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="lf-logo.png" alt="LF monogram logo" class="logo" />
    <h1>Lincoln Fischer</h1>
    <div class="rule"></div>
    <p class="subtitle">B.S. Agribusiness</p>
    <p class="grad">Texas A&amp;M University · Expected May 2028</p>

    <div class="links">
      <a class="button primary"
         href="https://www.linkedin.com/in/lincoln-fischer-134165386"
         target="_blank" rel="noopener noreferrer">
        View LinkedIn
      </a>

      <a class="button secondary"
         href="resume.docx"
         target="_blank" rel="noopener noreferrer">
        View Resume
      </a>
    </div>

    <p class="note">
     
    </p>

    <div class="footer">Texas A&amp;M University</div>
  </main>
</body>
</html>
